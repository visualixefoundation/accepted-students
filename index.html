<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accepted Students | Visualixe Foundation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --border: #e2e8f0;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 4px 12px rgba(15, 23, 42, 0.04);
      --radius: 16px;
      --header-bg: rgba(244, 246, 249, 0.85);
      --sticky-border: rgba(226, 232, 240, 0.8);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px 56px;
      flex: 1;
      width: 100%;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--sticky-border);
      margin: -24px -20px 28px;
      padding: 14px 20px 16px;
    }
    .sticky-inner { max-width: 960px; margin: 0 auto; }
    .header-top {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .search-wrap { position: relative; max-width: 100%; }
    #searchBox {
      width: 100%;
      padding: 12px 16px 12px 42px;
      font-size: 14px;
      font-family: inherit;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #searchBox::placeholder { color: var(--text-muted); }
    #searchBox:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    #results {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      max-height: 280px;
      overflow-y: auto;
      text-align: left;
      z-index: 50;
    }
    #results p {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    #results p:last-child { border-bottom: none; }
    #results a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    #results a:hover { text-decoration: underline; }
    .hero {
      text-align: center;
      margin-bottom: 28px;
    }
    .hero h1 {
      font-size: clamp(26px, 5vw, 34px);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 460px;
      margin: 0 auto;
    }
    .home-categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      max-width: 600px;
      margin: 8px auto 0;
      gap: 20px;
    }
    @media (max-width: 560px) {
      .home-categories { grid-template-columns: 1fr; max-width: 320px; }
      .site-title { display: none; }
    }
    .cat-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 40px 24px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      font-family: inherit;
      width: 100%;
    }
    .cat-btn:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
      transform: translateY(-3px);
    }
    .cat-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .cat-icon.summer { background: #eff6ff; }
    .cat-label {
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      letter-spacing: -0.01em;
    }
    .cat-hint {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
      margin-top: -8px;
    }
    footer {
      background: var(--surface);
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 32px 20px;
      font-size: 14px;
      margin-top: auto;
    }
    footer a {
      color: var(--primary);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 500;
    }
    footer a:hover { opacity: 0.85; }
    footer .tagline { margin-top: 8px; font-size: 13px; color: var(--text-muted); opacity: 0.75; }
  </style>
</head>
<body>

        <div class="header-top">

            <span class="badge"><span>🎓</span><span>Visualixe Foundation</span></span>

        </div>
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchBox" placeholder="Search for a student by name..." autocomplete="off">
          <div id="results"></div>

    </div>

    <div class="hero">
      <h1>Accepted Students</h1>
      <p class="subtitle">Discover students accepted into the Yale Young African Scholars program.</p>
    </div>

    <div class="home-categories" style="grid-template-columns: 1fr; max-width: 320px;">

    const searchBox = document.getElementById("searchBox");
    const resultsDiv = document.getElementById("results");
    searchBox.addEventListener("input", function () {
      const query = this.value.toLowerCase().trim();
      resultsDiv.innerHTML = "";
      if (query.length > 1) {
        const matches = students.filter(s => s.name.toLowerCase().includes(query));
        resultsDiv.style.display = "block";
        if (matches.length) {
          matches.forEach(s => {
            const item = document.createElement("p");
            item.innerHTML = `<strong>${s.name}</strong> — <a href="${s.url}">${s.program}</a>`;
            resultsDiv.appendChild(item);
          });
        } else {
          resultsDiv.innerHTML = '<p style="color:#64748b">No matches found.</p>';
        }
      } else {
        resultsDiv.style.display = "none";
      }
    });
    document.addEventListener("click", e => {
      if (!e.target.closest(".search-wrap")) resultsDiv.style.display = "none";
    });
