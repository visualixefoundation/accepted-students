<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YYAS 2026 Accepted Students | Visualixe Foundation</title>
  <meta name="description" content="Full list of students accepted into Yale Young African Scholars 2026 — Online (6) and Residential (60) cohorts.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://accepted-students.vercel.app/yyas2026.html">
  <meta property="og:title" content="YYAS 2026 Accepted Students">
  <meta property="og:description" content="66 students accepted into Yale Young African Scholars 2026. Browse Online and Residential cohorts.">
  <meta property="og:site_name" content="Visualixe Foundation">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="YYAS 2026 Accepted Students">
  <meta name="twitter:description" content="66 students accepted into Yale Young African Scholars 2026.">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #fff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --border: #e2e8f0;
      --shadow: 0 1px 3px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.04);
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }
    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 20px 56px;
      flex: 1;
      width: 100%;
    }
    .back {
      display: inline-flex;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;
    }
    .back:hover { color: var(--primary); }
    h1 {
      font-size: clamp(24px, 4vw, 30px);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      box-shadow: var(--shadow);
    }
    .stat span { color: var(--muted); font-weight: 500; margin-left: 4px; }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filter-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .list-search {
      position: relative;
      margin-bottom: 24px;
    }
    .list-search input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      font-size: 14px;
      font-family: inherit;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
      outline: none;
    }
    .list-search input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    .list-search svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s, box-shadow 0.15s;
      scroll-margin-top: 20px;
    }
    @media (max-width: 480px) {
      .card {
        padding: 12px 14px;
        gap: 8px;
      }
      .cards { gap: 10px; }
      .page { padding: 24px 16px 48px; }
    }
    .card:hover {
      border-color: #bfdbfe;
      box-shadow: 0 4px 16px rgba(37,99,235,0.08);
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .card-name {
      font-weight: 600;
      font-size: 15px;
      line-height: 1.35;
    }
    .card-name mark {
      background: #fef08a;
      border-radius: 2px;
      padding: 0 1px;
    }
    .type-badge {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .type-badge.online {
      background: #ecfdf5;
      color: #059669;
    }
    .type-badge.residential {
      background: #eff6ff;
      color: #2563eb;
    }
    .card-socials {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 28px;
      align-items: center;
    }
    .social-link {
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 7px;
      transition: background 0.15s;
    }
    .social-link.linkedin {
      color: var(--primary);
      background: var(--primary-soft);
    }
    .social-link.linkedin:hover { background: #dbeafe; }
    .social-link.instagram {
      color: #c026d3;
      background: #fdf4ff;
    }
    .social-link.instagram:hover { background: #fae8ff; }
    .no-profile {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }
    .action-btn {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .action-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }
    .action-btn.copied {
      border-color: #059669;
      color: #059669;
      background: #ecfdf5;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }

    footer {
      background: #0f1115;
      color: #94a3b8;
      text-align: center;
      padding: 32px 20px;
      font-size: 14px;
      margin-top: auto;
    }
    footer a {
      color: #5eead4;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 500;
    }
    footer a:hover { color: #99f6e4; }
    footer .tagline { margin-top: 8px; font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <div class="page">
    <a class="back" href="index.html">← Back to Programs</a>
    <h1>YYAS 2026</h1>
    <p class="meta">Accepted Students · Online & Residential</p>

    <div class="stats" id="stats">
      <div class="stat">66 <span>students</span></div>
      <div class="stat">6 <span>Online</span></div>
      <div class="stat">60 <span>Residential</span></div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="online">Online</button>
      <button class="filter-btn" data-filter="residential">Residential</button>
    </div>

    <div class="list-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="listSearch" placeholder="Filter by name..." autocomplete="off">
    </div>

    <div class="cards" id="cards"></div>
  </div>

  <footer>
    <p>&copy; 2026 <a href="https://visualixe-foundation.vercel.app/" target="_blank" rel="noopener">Visualixe Foundation</a>. All rights reserved.</p>
    <p class="tagline">Built with purpose ✌️</p>
  </footer>

  <script>
    let students = [];
    let currentFilter = 'all';
    let searchQuery = '';

    async function load() {
      const res = await fetch('students.json');
      students = await res.json();
      // Sort A-Z by name once on load
      students.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
      render();
      if (location.hash) {
        const el = document.querySelector(location.hash);
        if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
      }
    }

    function highlight(text, query) {
      if (!query) return text;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp('(' + escaped + ')', 'gi');
      return text.replace(re, '<mark>$1</mark>');
    }

    function render() {
      const container = document.getElementById('cards');
      let list = students.slice(); // already sorted A-Z

      if (currentFilter !== 'all') {
        list = list.filter(s => s.type === currentFilter);
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        list = list.filter(s => {
          const name = s.name.toLowerCase();
          return name.includes(q) || name.split(' ').some(p => p.startsWith(q));
        });
      }

      if (!list.length) {
        container.innerHTML = '<div class="empty-state">No students match your filters.</div>';
        return;
      }

      container.innerHTML = list.map(s => {
        const socialsHtml = s.socials && s.socials.length
          ? s.socials.map(soc => {
              const label = soc.type === 'linkedin' ? 'LinkedIn' : 'Instagram';
              return '<a class="social-link ' + soc.type + '" href="' + soc.url + '" target="_blank" rel="noopener">' + label + '</a>';
            }).join('')
          : '<span class="no-profile">No public profile yet</span>';

        return '<div class="card" id="' + s.id + '">' +
          '<div class="card-top">' +
            '<div class="card-name">' + highlight(s.name, searchQuery) + '</div>' +
            '<span class="type-badge ' + s.type + '">' + s.type + '</span>' +
          '</div>' +
          '<div class="card-socials">' + socialsHtml + '</div>' +
          '<div class="card-actions">' +
            '<button class="action-btn" onclick="copyLink(\'' + s.id + '\', this)" title="Copy link to this student">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>' +
              ' Copy link' +
            '</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function copyLink(id, btn) {
      const url = location.origin + location.pathname + '#' + id;
      navigator.clipboard.writeText(url).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = '✓ Copied';
        // Stays green permanently (no timeout)
      });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    document.getElementById('listSearch').addEventListener('input', function () {
      searchQuery = this.value.trim();
      render();
    });

    load();
  </script>
</body>
</html>
